[build-system]
requires = ["setuptools>=68", "wheel", "cmake>=3.26", "pybind11>=2.11"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "inference-engine"
version = "0.1.0"
description = "Minimal continuous-batching LLM inference engine with iteration-level scheduling"
authors = [{ name = "sh1v-ansh" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "protobuf>=4.25.0",
    "numpy>=1.26.0",
    "transformers>=4.39.0",
    "sentencepiece>=0.2.0",
    "pydantic>=2.6.0",
    "uvloop>=0.19.0",
    "aiohttp>=3.9.0",
    "tqdm>=4.66.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
